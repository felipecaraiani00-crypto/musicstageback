<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo escuro com cantos arredondados e borda sutil -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Barras de onda sonora de fundo -->
  <rect x="13" y="26" width="3" height="12" rx="1.5" fill="#06b6d4" opacity="0.4" />
  <rect x="18" y="20" width="3" height="24" rx="1.5" fill="#06b6d4" opacity="0.6" />
  <rect x="46" y="22" width="3" height="20" rx="1.5" fill="#06b6d4" opacity="0.6" />
  <rect x="51" y="27" width="3" height="10" rx="1.5" fill="#06b6d4" opacity="0.4" />

  <!-- Símbolo de Play centralizado e vibrante com glow -->
  <path d="M26 18.5C26 16.9 27.8 15.9 29.2 16.7L44.8 29.7C46 30.7 46 32.3 44.8 33.3L29.2 46.3C27.8 47.1 26 46.1 26 44.5V18.5Z" 
        fill="url(#cyanGrad)" 
        filter="url(#glow)" />
</svg>
